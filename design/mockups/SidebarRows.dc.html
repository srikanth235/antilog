<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SidebarRows</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./icons.css">
<link rel="stylesheet" href="./components.css">
</helmet>
<div class="board" style="display: contents;">
  <!-- part:SidebarTop -->
    <div class="cs-top">
      <button class="icon-btn" aria-haspopup="menu" aria-label="Sort sessions" title="Sort sessions"><i class="ic i-sort"></i></button><a class="icon-btn" data-item="new" href="NewSession.dc.html" aria-label="New session" title="New session"><i class="ic i-plus"></i></a>
    </div>
  <!-- /part -->
  <div class="side-scroll">
    <div class="cs-g">
      <button class="cs-pill" aria-expanded="true">Pinned<i class="ic s i-chev"></i></button>
      <div class="cs-r"><i class="ic i-pin" aria-hidden="true"></i><span class="cs-t">Fix flaky checkout tests</span><span class="cs-tail"><span role="img" aria-label="Working" title="Working" class="cs-d work"></span></span><button class="cs-more" aria-haspopup="menu" aria-label="Options for Fix flaky checkout tests"><i class="ic s i-more"></i></button><a class="cs-a" data-item="cut-checkout-p95" href="SessionWorking.dc.html" aria-label="Fix flaky checkout tests"></a></div>
    </div>
    <div class="cs-g">
      <button class="cs-ph" aria-expanded="true">Checkout platform<i class="ic s i-chev"></i></button>
      <div class="cs-r"><span class="cs-t">Add retries to the webhook sender</span><span class="cs-tail"><span role="img" aria-label="Waiting for you" title="Waiting for you" class="cs-d wait"></span></span><button class="cs-more" aria-haspopup="menu" aria-label="Options for Add retries to the webhook sender"><i class="ic s i-more"></i></button><a class="cs-a" data-item="reduce-forecast-error" href="SessionCredential.dc.html" aria-label="Add retries to the webhook sender"></a></div>
      <div class="cs-r"><span class="cs-t">Remove the legacy feature flags</span><span class="cs-tail"><i role="img" aria-label="Pull request opened" class="ic cs-pr st-pr"></i></span><button class="cs-more" aria-haspopup="menu" aria-label="Options for Remove the legacy feature flags"><i class="ic s i-more"></i></button><a class="cs-a" href="SessionWorking.dc.html" aria-label="Remove the legacy feature flags"></a></div>
    </div>
    <div class="cs-g">
      <button class="cs-ph" aria-expanded="true">Web<i class="ic s i-chev"></i></button>
      <div class="cs-r"><span class="cs-t">Upgrade to React 19</span><span class="cs-tail"><i role="img" aria-label="Pull request opened" class="ic cs-pr st-pr"></i></span><button class="cs-more" aria-haspopup="menu" aria-label="Options for Upgrade to React 19"><i class="ic s i-more"></i></button><a class="cs-a" data-item="shrink-production-bundle" href="SessionWorking.dc.html" aria-label="Upgrade to React 19"></a></div>
      <div class="cs-r"><span class="cs-t">Rename the settings tabs</span><span class="cs-tail"><i role="img" aria-label="Pull request opened" class="ic cs-pr st-pr"></i></span><button class="cs-more" aria-haspopup="menu" aria-label="Options for Rename the settings tabs"><i class="ic s i-more"></i></button><a class="cs-a" href="SessionWorking.dc.html" aria-label="Rename the settings tabs"></a></div>
    </div>
    <div class="cs-g">
      <button class="cs-ph" aria-expanded="true">Platform<i class="ic s i-chev"></i></button>
      <div class="cs-r"><span class="cs-t">Move cron jobs to the queue</span><span class="cs-tail"><span role="img" aria-label="Failed" title="Failed" class="cs-d fail"></span></span><button class="cs-more" aria-haspopup="menu" aria-label="Options for Move cron jobs to the queue"><i class="ic s i-more"></i></button><a class="cs-a" data-item="autocomplete-latency" href="SessionFailed.dc.html" aria-label="Move cron jobs to the queue"></a></div>
    </div>
    <div class="cs-g">
      <button class="cs-ph" aria-expanded="true">Docs<i class="ic s i-chev"></i></button>
      <div class="cs-r"><span class="cs-t">Document the billing API</span><span class="cs-tail"><span role="img" aria-label="Done" title="Done" class="cs-d "></span></span><button class="cs-more" aria-haspopup="menu" aria-label="Options for Document the billing API"><i class="ic s i-more"></i></button><a class="cs-a" href="SessionWorking.dc.html" aria-label="Document the billing API"></a></div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
