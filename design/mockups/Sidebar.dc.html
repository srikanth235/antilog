<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./icons.css">
<link rel="stylesheet" href="./components.css">
</helmet>
<div class="board" style="display: contents;">
<nav class="{{u.cls}}" aria-label="Main">
  <sc-if value="{{u.mac}}"><div class="lights" aria-hidden="true" data-keep><i style="background: #FF5F57; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.18);"></i><i style="background: #FEBC2E; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.18);"></i><i style="background: #28C840; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.18);"></i></div></sc-if>
  <div class="side-top">
    <a class="brand" href="{{u.home}}"><svg aria-hidden="true" width="36" height="22" viewBox="218 338 600 369" data-keep><defs><linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8E4B8"/><stop offset=".6" stop-color="#E2BE7C"/><stop offset="1" stop-color="#BE8F49"/></linearGradient></defs><path d="M397.8 434.8L397.8 466.2A31.5 31.5 0 0 1 366.4 434.8Z" style="fill:var(--mark)" fill-opacity="0.12"/><path d="M407.7 434.8L407.7 466.2A31.5 31.5 0 0 0 439.2 434.8Z" style="fill:var(--mark)" fill-opacity="0.18"/><path d="M361.6 424.9L439.2 424.9A77.6 77.6 0 0 0 361.6 347.3Z" style="fill:var(--mark)" fill-opacity="0.28"/><path d="M351.7 471.0L227.9 471.0A123.8 123.8 0 0 1 351.7 347.3Z" style="fill:var(--mark)" fill-opacity="0.42"/><path d="M444.0 480.9L444.0 697.0A216.1 216.1 0 0 1 227.9 480.9Z" style="fill:var(--mark)" fill-opacity="0.6"/><path d="M453.9 342.5L453.9 697.0A354.5 354.5 0 0 0 808.4 342.5Z" fill="url(#brass)"/></svg>Ratchet</a>
    <div class="col" style="gap: 2px;">
      <button class="nav"><i class="ic i-search"></i>Search<span class="kc" aria-hidden="true" style="margin-left: auto;">⌘K</span></button>
      <sc-for list="{{nav}}" as="n"><a class="{{n.cls}}" href="{{n.href}}"><i class="ic {{n.icon}}"></i>{{n.label}}</a></sc-for>
      <button class="nav"><i class="ic i-more"></i>More</button>
    </div>
    <a class="btn primary full" href="{{u.fresh}}"><i class="ic s i-plus"></i>New experiment</a>
  </div>
  <div class="side-scroll">
    <sc-for list="{{groups}}" as="g">
      <div class="col" style="gap: 2px;">
        <sc-if value="{{g.pinned}}"><span class="t-label" style="padding: 4px 10px 6px;">Pinned</span></sc-if>
        <sc-if value="{{g.name}}"><div class="gh"><button class="rec" aria-expanded="true"><i class="ic s chev i-chev" style="transform: rotate(90deg);"></i><span class="t">{{g.name}}</span></button><sc-if value="{{g.plus}}"><a class="plus" href="{{u.fresh}}" aria-label="New experiment in {{g.name}}"><i class="ic s i-plus"></i></a></sc-if></div></sc-if>
        <sc-for list="{{g.rows}}" as="r"><div class="srow"><a class="{{r.cls}}" href="{{r.href}}"><span class="t">{{r.title}}</span><span class="tail"><sc-if value="{{r.count}}"><span class="cnt">{{r.count}}</span></sc-if><span role="img" aria-label="{{r.lab}}" title="{{r.lab}}" class="{{r.gcls}}" style="color: {{r.col}};"></span></span></a><button class="pinb" aria-label="Pin {{r.title}}"><i class="ic s i-pin"></i></button></div></sc-for>
      </div>
    </sc-for>
  </div>
  <div class="side-foot">
    <sc-if value="{{u.mac}}"><div class="rw g8 xs" style="padding: 0 10px 8px;"><span class="dot" style="background: var(--good);"></span><span class="ink2">This machine</span><span class="mut" style="margin-left: auto;">Ready</span></div></sc-if>
    <a class="nav" href="{{u.settings}}" aria-label="Priya Raman, user menu" style="height: 48px; gap: 12px;"><span aria-hidden="true" class="avatar round" style="width: 30px; height: 30px; font-size: 14px;">P</span><span class="col grow" style="line-height: 1.25;"><span style="color: var(--ink);">Priya Raman</span><span class="xs mut">via Okta</span></span><i class="ic s mut i-more"></i></a>
  </div>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"text","default":"ThreadRunning"},"dark":{"editor":"text","default":""},"variant":{"editor":"text","default":""},"$preview":{"width":256,"height":900}}'>
// Props: active = the board the sidebar sits on (ThreadRunning, Customize, Home, Dashboard);
// dark = "1" in a dark twin, so links stay in dark; variant = "mac" for the macOS window sidebar.
// links: Home Dashboard Connectors NewExperiment SettingsProfile MacSettingsWindow ThreadRunning MacMain ThreadWin ThreadNoWin
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'ThreadRunning';
    const sfx = this.props.dark ? 'Dark' : '';
    const MAC = { ThreadRunning: 'MacMain', SettingsProfile: 'MacSettingsWindow' };
    const mac = this.props.variant === 'mac';
    const link = (b) => (mac && MAC[b] ? MAC[b] : b) + sfx + '.dc.html';
    const ST = { run: ['Running', 'var(--accent)'], win: ['Win', 'var(--good)'], none: ['No win', 'var(--ink3)'], merged: ['Merged', 'var(--good)'], draft: ['Draft', 'var(--ink3)'], pr: ['Pull request open', 'var(--accent)'] };
    const row = (title, st, count, board) => ({
      title, count: count || '', href: link(board || 'ThreadRunning'), lab: ST[st][0], col: ST[st][1],
      gcls: 'st gi st-' + st + (st === 'run' ? ' run' : ''), cls: (title === 'Checkout p95' && active === 'ThreadRunning') ? 'rec on' : 'rec',
    });
    const nav = [['i-folder', 'Projects', 'Home'], ['i-chart', 'Dashboard', 'Dashboard'], ['i-sliders', 'Customize', 'Connectors']]
      .map(([icon, label, board]) => ({ icon, label, href: link(board), cls: (label === active || board === active) ? 'nav on' : 'nav' }));
    return {
      u: { mac: this.props.variant === 'mac', cls: this.props.variant === 'mac' ? 'side mac' : 'side', home: link('Home'), fresh: link('NewExperiment'), settings: link('SettingsProfile') },
      nav,
      groups: [
        { pinned: true, name: '', rows: [row('Checkout p95', 'run', 3, 'ThreadRunning')] },
        { name: 'Checkout platform', plus: true, rows: [row('Forecast accuracy', 'win', 2, 'ThreadWin'), row('CLI cold start', 'run', '', 'ThreadRunning'), row('Bundle size', 'none', 2, 'ThreadNoWin'), row('Image resize', 'merged', '', 'ThreadWin'), row('Smoke suite duration', 'draft', '', 'NewExperiment')] },
        { name: 'Search', plus: true, rows: [row('Search relevance', 'pr', 2, 'ThreadWin'), row('Autocomplete latency', 'run', '', 'ThreadRunning')] },
        { name: 'Data science forecasts', plus: false, rows: [row('Feature pipeline cost', 'merged', '', 'ThreadWin')] },
      ],
    };
  }
}
</script>
</body>
</html>
