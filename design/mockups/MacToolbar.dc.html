<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MacToolbar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./icons.css">
<link rel="stylesheet" href="./components.css">
</helmet>
<div class="board" style="display: contents;">
<div class="mtool">
  <button class="icon-btn" aria-label="Show or hide the sidebar"><i class="ic i-chev" style="transform: rotate(180deg);"></i></button>
  <div class="ttl"><span class="ell">{{title}}</span><sc-if value="{{status}}"><span class="spill" style="--c: var(--accent); font-weight: 500; letter-spacing: 0;"><span class="st run gi st-run"></span>{{status}}</span></sc-if></div>
  <span class="grow"></span>
  <sc-if value="{{actions}}"><button class="btn sm danger">Stop run</button><button class="icon-btn" aria-label="Unpin"><i class="ic i-pin"></i></button></sc-if>
  <button class="tsearch" aria-label="Search"><i class="ic s i-search"></i>Search<span class="kc" aria-hidden="true">⌘K</span></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Checkout p95"},"status":{"editor":"text","default":"Running"},"actions":{"editor":"text","default":"1"},"$preview":{"width":1112,"height":52}}'>
// Props: title, status (a word, or empty), actions ("1" shows Stop run and Unpin).
class Component extends DCLogic {
  renderVals() {
    return { title: this.props.title ?? 'Checkout p95', status: this.props.status ?? '', actions: !!this.props.actions };
  }
}
</script>
</body>
</html>
