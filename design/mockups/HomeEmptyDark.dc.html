<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home, empty · dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./icons.css">
<link rel="stylesheet" href="./components.css">
<link rel="stylesheet" href="./logos.css">
</helmet>
<div data-theme="dark" class="board app" style="width: 1440px; height: 900px;">
  <!-- part:SidebarEmpty -->
  <nav class="side cs" aria-label="Main">
      <div class="cs-top">
        <button class="icon-btn" aria-haspopup="menu" aria-label="Sort sessions" title="Sort sessions"><i class="ic i-sort"></i></button><a class="icon-btn" data-item="new" href="NewSessionDark.dc.html" aria-label="New session" title="New session"><i class="ic i-plus"></i></a>
      </div>
    <div class="side-scroll"><p class="sd-none">Sessions you start appear here.</p></div>
      <div class="side-foot">
        <button class="nav acct" aria-haspopup="menu" aria-expanded="false" aria-label="Priya Raman, Acme, account and settings"><span aria-hidden="true" class="avatar round" style="width: 30px; height: 30px; font-size: 14px;">P</span><span class="col grow" style="line-height: 1.25;"><span style="color: var(--ink);">Priya Raman</span><span class="xs mut">Acme · Settings</span></span><i class="ic s mut i-more"></i></button>
      </div>
  </nav>
  <!-- /part -->
  <main class="main">
    <div class="scroll">
      <div class="hw hw-c">
        <h1 class="t-title hw-t">What do you want to improve?</h1>
        <div class="cmpw">
    <div class="cmp big">
      <textarea class="cmp-in" rows="3" aria-label="New experiment" placeholder="What do you want to improve? Type / for commands"></textarea>
      <div class="cmp-bar">
        <button class="ib" aria-label="Attach files, images, repos or connectors"><i class="ic i-plus"></i></button>
        <span class="go"><button class="ib" aria-label="Dictate"><i class="ic i-mic"></i></button><button class="ib send" aria-label="Send"><i class="ic i-return"></i></button></span>
      </div>
    </div>
    <div class="cmp-opt">
      <button class="opt" aria-label="Project"><i class="ic i-folder"></i><span>Checkout platform</span></button>
      <button class="opt" aria-label="Repos"><i class="ic g-git"></i><span>None</span></button>
      <button class="opt" aria-label="Agent" title="Auto picks the agent with the lowest cost per win for this kind of experiment here. Before there is data it uses your organization's default agent."><i class="ic g-spark"></i><span>Auto</span></button>
      <button class="opt" aria-label="Environment"><i class="ic g-box"></i><span>bench-std</span></button>
      <button class="opt" aria-label="Mode"><i class="ic i-sliders"></i><span>Ask</span></button>
      <button class="opt" aria-label="Budget"><span class="ring" style="--p: 0;" role="img" aria-label="Budget used"></span><span>$0 of $10</span></button>
    </div>
  </div>
        <p class="sub" style="text-align: center; margin: 0 auto;">No experiments yet.</p>
      </div>
    </div>
  </main>
</div>
</x-dc>
</body>
</html>
