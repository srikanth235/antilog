<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Topbar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./icons.css">
<link rel="stylesheet" href="./components.css">
</helmet>
<div class="board" style="display: contents;">
<div class="top">
  <div class="crumbs"><sc-for list="{{trail}}" as="t"><span class="{{t.cls}}" style="{{t.style}}">{{t.label}}</span></sc-for></div>
  <div class="rw g8"><button class="tsearch" aria-label="Search"><i class="ic s i-search"></i>Search<span class="kc" aria-hidden="true">⌘K</span></button></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"trail":{"editor":"text","default":"Checkout platform|Checkout p95"},"$preview":{"width":1184,"height":52}}'>
// Props: trail = breadcrumb parts separated by |; the last one is the current page.
class Component extends DCLogic {
  renderVals() {
    const parts = (this.props.trail ?? 'Checkout platform|Checkout p95').split('|');
    const out = [];
    parts.forEach((label, i) => {
      if (i) out.push({ label: '/', cls: 'mut', style: '' });
      out.push(i === parts.length - 1 ? { label, cls: 'ell', style: 'font-weight: 500;' } : { label, cls: 'textbtn', style: '' });
    });
    return { trail: out };
  }
}
</script>
</body>
</html>
