[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100.0"
license = "FSL-1.1-ALv2"
publish = false

[workspace.dependencies]
antilog-types = { path = "crates/antilog-types" }
antilog-core = { path = "crates/antilog-core" }
antilog-server = { path = "crates/antilog-server" }
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = "3.0.0"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
getrandom = "0.4.3"
jiff = "0.2.43"
lambda_http = { version = "1.3.2", default-features = false, features = ["apigw_http"] }
oauth2 = "5.0.0"
openidconnect = "4.1.0"
proptest = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
hmac = "0.13.0"
subtle = "2.6.1"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate", "macros", "uuid"] }
testcontainers = "0.28.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tokio-stream = { version = "0.1.19", default-features = false }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
utoipa = { version = "6.0.0", features = ["uuid"] }
uuid = { version = "1.29.2", features = ["v4", "v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
