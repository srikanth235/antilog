name: deploy-aws

# Antilog cloud on AWS (us-east-1). Only this workflow deploys; nobody runs `tofu apply`
# or `cargo lambda deploy` from a laptop. It is never started by a push.
#
#  - A pull request that touches the infrastructure or the Lambda crates is checked
#    (format, validate) with no AWS access. A real `tofu plan` runs on it only when the
#    repository variable AWS_PLAN_ROLE_ARN names a role that trusts pull requests: the
#    deploy role antilog-ci trusts the environment aws-dev alone.
#  - A manual run plans in the environment aws-dev, whose required reviewers approve
#    before any AWS call. Choosing "apply" plans, waits for the same approval again,
#    then applies exactly the plan that was reviewed.

on:
  pull_request:
    paths:
      - "deploy/tofu/**"
      - "crates/antilog-aws/**"
      - "crates/antilog-agentcore/**"
      - ".github/workflows/deploy-aws.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "plan only, or plan then apply"
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  TOFU_VERSION: 1.13.9
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::987432215914:role/antilog-ci
  TF_IN_AUTOMATION: "1"

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - run: tofu fmt -check -recursive deploy/tofu
      - name: Validate each module without a backend
        run: |
          for dir in deploy/tofu/aws deploy/tofu/aws/bootstrap; do
            tofu -chdir="$dir" init -backend=false -input=false
            tofu -chdir="$dir" validate
          done

  pr-plan:
    # Needs a role that trusts pull requests; skipped (not failed) until the owner adds one.
    if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != ''
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: "Plan (a stand-in zip, because the plan does not run it)"
        working-directory: deploy/tofu/aws
        run: |
          echo placeholder > bootstrap && zip -q /tmp/bootstrap.zip bootstrap && rm bootstrap
          tofu init -input=false -backend-config=backend.hcl
          tofu plan -input=false -lock=false -var "server_zip=/tmp/bootstrap.zip"

  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: aws-dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: cargo-lambda at its pinned version (brings its own zig)
        run: pip install cargo-lambda==1.9.2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lambda-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: lambda-
      - name: Build the server for Lambda
        env:
          SQLX_OFFLINE: "true"
        run: cargo lambda build --release --arm64 --output-format zip -p antilog-aws --locked
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Plan
        working-directory: deploy/tofu/aws
        run: |
          tofu init -input=false -backend-config=backend.hcl
          tofu plan -input=false -out=tfplan -var "server_zip=$GITHUB_WORKSPACE/target/lambda/antilog-lambda/bootstrap.zip"
          tofu show -no-color tfplan > plan.txt
          { echo '### tofu plan'; echo '```'; head -c 60000 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: tfplan
          path: |
            deploy/tofu/aws/tfplan
            target/lambda/antilog-lambda/bootstrap.zip
          retention-days: 3

  apply:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    needs: plan
    runs-on: ubuntu-latest
    environment: aws-dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - uses: actions/download-artifact@v5
        with:
          name: tfplan
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Apply the plan that was reviewed
        working-directory: deploy/tofu/aws
        run: |
          # The artifact restored the plan and the zip it names at the paths they had.
          tofu init -input=false -backend-config=backend.hcl
          tofu apply -input=false tfplan
      - name: Migrate the database (the first request after a pause waits for Aurora)
        run: |
          fn=$(tofu -chdir=deploy/tofu/aws output -raw server_function)
          aws lambda invoke --function-name "$fn" --cli-binary-format raw-in-base64-out \
            --cli-read-timeout 300 --payload fileb://deploy/tofu/aws/events/migrate.json /tmp/migrate.out
          cat /tmp/migrate.out; echo
          grep -q migrated /tmp/migrate.out
      - name: Publish the web app, when it has a build
        run: |
          if jq -e '.scripts.build' web/package.json >/dev/null; then
            npm install --global pnpm@12.18.0
            (cd web && pnpm install --frozen-lockfile && pnpm build)
            bucket=$(tofu -chdir=deploy/tofu/aws output -raw web_bucket)
            aws s3 sync web/dist "s3://$bucket" --delete
            aws cloudfront create-invalidation --paths '/*' \
              --distribution-id "$(tofu -chdir=deploy/tofu/aws output -raw web_distribution_id)"
          else
            echo "web has no build script yet; nothing to publish"
          fi
