name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

# Agents push often: a newer push to the same branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Conventional Commits
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "$BASE" ]; then
            range="$BASE..HEAD"
          elif [ "$GITHUB_REF_NAME" = "$DEFAULT" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="$(git merge-base "origin/$DEFAULT" HEAD)..HEAD"
          fi
          echo "checking $range"
          fail=0
          for c in $(git rev-list --no-merges "$range"); do
            git log -1 --format=%B "$c" > "$RUNNER_TEMP/msg"
            .githooks/commit-msg "$RUNNER_TEMP/msg" || { echo "  in $(git log -1 --format='%h' "$c")"; fail=1; }
          done
          exit $fail

  files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Secrets, stray files, house rules, design boards
        run: .githooks/pre-commit --all

  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-
      - name: Tools at pinned versions
        run: |
          cargo install --locked cargo-nextest@0.9.152
          cargo install --locked cargo-deny@0.20.2
          cargo install --locked sqlx-cli@0.9.0 --no-default-features --features postgres,rustls
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests, with Postgres 18 in a container
        run: cargo nextest run --workspace
      - run: cargo deny check
      - name: Offline query data is current
        env:
          DATABASE_URL: postgres://postgres:pw@localhost:5432/antilog
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=pw -p 5432:5432 postgres:18
          until docker exec pg pg_isready -U postgres >/dev/null 2>&1; do sleep 1; done
          SQLX_OFFLINE=false cargo sqlx database create
          SQLX_OFFLINE=false cargo sqlx migrate run --source crates/antilog-server/migrations
          SQLX_OFFLINE=false cargo sqlx prepare --workspace --check
      - name: OpenAPI document is current
        run: cargo run -q -p antilog-server -- openapi | diff - openapi/antilog.json

  web-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26.13.1
      - run: npm install --global pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - name: Generated client is current
        run: |
          pnpm generate:api
          git diff --exit-code -- src/api/schema.d.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  web-e2e:
    # Playwright smoke tests: the built client against the server on its fakes, in light and dark.
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://postgres:pw@localhost:5432/antilog
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: antilog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: web-e2e-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: web-e2e-
      - run: cargo build -p antilog-server
      - uses: actions/setup-node@v5
        with:
          node-version: 26.13.1
      - run: npm install --global pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Playwright smoke tests (the runner's own Chrome; no browser download)
        working-directory: web
        env:
          ANTILOG_SERVER_BIN: ${{ github.workspace }}/target/debug/antilog-server
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
        run: pnpm e2e
